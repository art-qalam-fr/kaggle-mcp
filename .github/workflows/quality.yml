name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-smell:
    name: Code smell (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Ruff lint
        run: pip install ruff && ruff check --output-format=github .

  coverage:
    name: Code coverage (best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: pip install uv && uv sync
      - name: Run tests with coverage
        run: uv run --with pytest --with pytest-cov python -m pytest --cov --cov-report=xml --cov-report=term -q || echo "No tests collected - skipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: pip install uv && uv sync
      - name: Audit locked dependencies
        run: uv export --no-dev --format requirements-txt -o /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
